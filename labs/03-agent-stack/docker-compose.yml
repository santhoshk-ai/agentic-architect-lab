# Postgres 17 + pgvector for Block 2 (VECTOR_STORE=pgvector). Lab-only credentials.
services:
  pgvector:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
